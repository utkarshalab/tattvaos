# ips — Tattva OS Intrusion Prevention System Configuration
# Enterprise-grade configuration for premium skeleton

[module]
name = "ips"
enabled = true
version = "2.0.0-enterprise"
log_level = "info"

[security]
fail_closed = true              ; IPS fails closed by default (secure)
audit_enabled = true
constant_time = false

[paths]
src_dir = "src"
include_dir = "include"
bin_dir = "bin"
build_dir = "build"
config_dir = "config"
docs_dir = "docs"
tests_dir = "tests"

[enforcement]
# Default action when no rule matches
default_action = "drop"         ; allow | drop | reset | throttle | quarantine | block | redirect | inspect_deep | sandbox | challenge
# Fail mode: closed (block on error) or open (allow on error)
fail_mode = "closed"            ; closed | open
# Inline enforcement enabled
inline_enforcement = true

[connections]
# Maximum concurrent connections
max_connections = 100000
# Connection timeout (seconds)
conn_timeout_sec = 3600
# Maximum connections per source IP
max_conns_per_ip = 1000

[blocklist]
# Maximum blocklist entries
max_entries = 50000
# Default block duration (milliseconds)
default_block_duration_ms = 3600000   ; 1 hour
# Auto-expire expired entries
auto_expire = true

[quarantine]
# Quarantine enabled
enabled = true
# Quarantine VLAN ID (0 = none/not configured)
vlan_id = 0
# Default quarantine duration (milliseconds)
default_quarantine_duration_ms = 86400000   ; 24 hours

[rate_limiter]
# Rate limiting enabled
enabled = true
# Global requests per second
global_rps = 1000
# Per-IP requests per second
per_ip_rps = 100
# Rate limit window (milliseconds)
window_ms = 1000

[bypass]
# Bypass rules enabled
enabled = true
# Fail-open for HA paths (use with caution)
fail_open_ha_paths = false

[geoip]
# GeoIP filtering enabled
enabled = false
# Blocked country codes (ISO 3166-1 alpha-2 numeric, comma-separated)
blocked_countries = ""
# Blocked continent codes
blocked_continents = ""

[app_control]
# Application control enabled
enabled = false
# Default action for unknown applications
default_action = "allow"        ; allow | block
# Allowed applications (comma-separated app IDs)
allowed_apps = ""
# Blocked applications (comma-separated app IDs)
blocked_apps = ""

[tls_inspector]
# TLS inspection enabled
enabled = false
# JA3 fingerprint blocking enabled
ja3_blocking = true
# Certificate pinning enforcement
cert_pinning = false
# Minimum TLS version
min_tls_version = "1.2"
# Blocked cipher suites (comma-separated)
blocked_ciphers = ""

[dns_filter]
# DNS filtering enabled
enabled = false
# DNS tunneling detection enabled
tunneling_detection = true
# Blocked domains (comma-separated)
blocked_domains = ""
# Blocked categories (comma-separated)
blocked_categories = ""

[file_analysis]
# File analysis enabled
enabled = false
# Maximum file size to analyze (bytes)
max_file_size = 10485760
# Sandbox integration enabled
sandbox_enabled = false
# Sandbox URL
sandbox_url = ""

[url_filter]
# URL filtering enabled
enabled = false
# Blocked URL categories (comma-separated)
blocked_categories = "malware,phishing,adult,piracy"
# Custom blocked URLs (comma-separated)
blocked_urls = ""

[bot_detector]
# Bot detection enabled
enabled = false
# Bot score threshold (0-100)
threshold = 70
# Challenge bots instead of blocking
challenge_bots = true

[ddos_protector]
# DDoS protection enabled
enabled = true
# SYN flood threshold (packets per second)
syn_flood_pps = 10000
# UDP flood threshold (packets per second)
udp_flood_pps = 50000
# HTTP flood threshold (requests per second)
http_flood_rps = 10000
# Connection rate threshold (connections per second)
conn_rate_pps = 5000

[threat_feed]
# Threat feed integration enabled
enabled = false
# Feed update interval (seconds)
update_interval_sec = 300
# Feed authentication enabled
feed_auth = false

[waf_engine]
# WAF enabled
enabled = false
# OWASP Top 10 rules enabled
owasp_top10 = true
# Custom rules enabled
custom_rules = true
# WAF action on violation
violation_action = "block"      ; allow | block | log

[packet_capture]
# Packet capture enabled
enabled = false
# Maximum capture packets
max_packets = 100000
# Capture filter (BPF syntax)
capture_filter = ""
# Capture directory
capture_dir = "/var/log/ips/captures"

[ha_cluster]
# HA clustering enabled
enabled = false
# This node ID
node_id = "node-1"
# Is this node primary?
is_primary = false
# Heartbeat interval (milliseconds)
heartbeat_interval_ms = 5000
# Cluster node IPs (comma-separated)
node_ips = ""

[api_protection]
# API protection enabled
enabled = false
# API key validation enabled
api_key_validation = true
# JWT validation enabled
jwt_validation = true
# Schema validation enabled
schema_validation = false

[ml_anomaly]
# ML anomaly detection enabled
enabled = false
# Anomaly score threshold (0-100)
threshold = 80
# Model retraining interval (hours)
retrain_interval_hours = 24

[stats]
# Sample interval (seconds)
sample_interval_sec = 60
# Maximum historical samples
max_samples = 10080   ; 7 days at 1-minute intervals
# Top blocked IPs count
top_blocked_count = 25

[integration]
# IDS integration (IDS alerts feed IPS policy)
ids_integration = true
# usrauth audit integration
audit_integration = true
# zero_trust integration (session revocation)
zero_trust_integration = true

[performance]
# Zero-copy packet inspection
zero_copy = true
# Parallel enforcement threads
enforcement_threads = 4
# Enforcement cache enabled
eval_cache_enabled = true
# Enforcement cache TTL (milliseconds)
eval_cache_ttl_ms = 1000
