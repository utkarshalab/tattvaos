# ids — Utkarsha OS Intrusion Detection System Configuration
# Enterprise-grade configuration for premium skeleton

[module]
name = "ids"
enabled = true
version = "1.0.0-enterprise-skeleton"
log_level = "info"

[security]
fail_closed = false            ; IDS is detection-only, never blocks
audit_enabled = true
constant_time = false          ; pattern matching not constant-time sensitive

[paths]
src_dir = "src"
include_dir = "include"
bin_dir = "bin"
build_dir = "build"
config_dir = "config"
docs_dir = "docs"
tests_dir = "tests"

[sensor]
# Packet capture interfaces (comma-separated)
interfaces = "eth0,eth1"
# Promiscuous mode
promiscuous = true
# Snapshot length (bytes to capture per packet)
snaplen = 65535
# Ring buffer size (packets)
ring_size = 100000

[reassembler]
# TCP stream reassembly timeout (milliseconds)
reassembly_timeout_ms = 30000
# Maximum concurrent streams
max_streams = 10000
# Reassembly buffer size per stream (bytes)
reasm_buf_size = 65536

[analyzer]
# Supported protocols (comma-separated)
protocols = "HTTP,DNS,TLS,SMB,FTP,SSH"
# Maximum payload to inspect per stream (bytes)
max_inspect_payload = 1048576

[rules]
# Maximum number of rules
max_rules = 100000
# Hot-reload enabled
hot_reload = true
# Rules file path
rules_file = "/etc/ids/rules.conf"

[detector]
# Port scan threshold (distinct ports per source IP in window)
port_scan_threshold = 100
# Port scan window (seconds)
port_scan_window_sec = 60
# Brute force threshold (failed auth attempts)
brute_force_threshold = 20
# Brute force window (seconds)
brute_force_window_sec = 300
# Data exfiltration threshold (bytes)
exfil_threshold_bytes = 10485760
# Anomaly score threshold (0-100)
anomaly_score_threshold = 80

[alert]
# Maximum alerts in memory
max_alerts = 100000
# Alert TTL (seconds)
alert_ttl_seconds = 604800
# Deduplication window (milliseconds)
dedup_window_ms = 300000

[correlator]
# Correlation time window (milliseconds)
window_ms = 300000
# Maximum correlation entries
max_correlations = 50000
# Threat score threshold for escalation (0-100)
escalation_threshold = 70

[siem]
# SIEM export enabled
enabled = false
# Export format: CEF, LEEF, JSON, SYSLOG
format = "CEF"
# SIEM host
host = ""
# SIEM port
port = 0
# Transport: udp, tcp, tls
transport = "udp"

[stats]
# Sample interval (seconds)
sample_interval_sec = 60
# Maximum historical samples
max_samples = 10080   ; 7 days at 1-minute intervals
# Top talkers count
top_talkers_count = 25

[integration]
# IPS integration (share blocklist)
ips_integration = true
# usrauth audit integration
audit_integration = true
# threat_intel integration
threat_intel_integration = true

[performance]
# Zero-copy packet capture
zero_copy = true
# Parallel inspection threads
inspection_threads = 4
# Inspection cache enabled
eval_cache_enabled = true
# Inspection cache TTL (milliseconds)
eval_cache_ttl_ms = 5000
