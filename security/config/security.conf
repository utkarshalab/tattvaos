# security/ — Utkarsha OS Enterprise Security Stack
# Global configuration shared across all modules

[security]
version = "1.0.0-skeleton"
fail_closed = true
audit_enabled = true
constant_time = true
log_level = "info"

[paths]
src_dir = "src"
include_dir = "include"
bin_dir = "bin"
build_dir = "build"
config_dir = "config"
docs_dir = "docs"
scripts_dir = "scripts"
tests_dir = "tests"

[modules]
digital_forensics = true
ids = true
incident_response = true
ips = true
malwarescan = true
privacy_compliance = true
soar = true
supply_chain = true
threat_intel = true
usrauth = true
vuln_scan = true
zero_trust = true

[usrauth]
# Reference monitor — intersection semantics (many deniers, one grant)
enable_rbac = true
enable_abac = true
enable_mac = true
enable_audit = true

[malwarescan]
# Malware detection & response
enable_scan_engine = true
enable_edr = true
enable_yara = true
enable_heuristic = true
enable_behavioral = true

[zero_trust]
# Zero Trust — never trust, always verify
enable_microsegmentation = true
enable_continuous_auth = true
enable_least_privilege = true
