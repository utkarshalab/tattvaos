# soar — Utkarsha OS Security Orchestration, Automation & Response Configuration
# Enterprise-grade configuration for premium skeleton

[module]
name = "soar"
enabled = true
version = "2.0.0-enterprise"
log_level = "info"

[security]
fail_closed = true
audit_enabled = true
constant_time = false

[paths]
src_dir = "src"
include_dir = "include"
bin_dir = "bin"
build_dir = "build"
config_dir = "config"
docs_dir = "docs"
tests_dir = "tests"

[soar]
max_rules = 50000
max_cases = 50000
max_alerts = 100000
max_actions = 100000
default_timeout_ms = 300000

[rules]
enabled = true
hot_reload = true
rules_file = "/etc/soar/rules.conf"

[alert]
enabled = true
max_alerts = 100000
alert_ttl_seconds = 604800
dedup_window_ms = 300000

[automation]
enabled = true
max_actions = 100000
action_timeout_ms = 300000

[scheduler]
enabled = true
max_schedules = 10000

[siem]
enabled = false
format = "CEF"
host = ""
port = 0
transport = "udp"

[stats]
sample_interval_sec = 60
max_samples = 10080

[integration]
ids_integration = true
ips_integration = true
malwarescan_integration = true
usrauth_audit = true

[performance]
eval_cache_enabled = true
eval_cache_ttl_ms = 1000
