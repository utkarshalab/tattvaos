# waf — Utkarsha OS Web Application Firewall Configuration
# Enterprise-grade configuration for premium skeleton

[module]
name = "waf"
enabled = true
version = "2.0.0-enterprise"
log_level = "info"

[security]
fail_closed = true
audit_enabled = true
constant_time = false

[paths]
src_dir = "src"
include_dir = "include"
bin_dir = "bin"
build_dir = "build"
config_dir = "config"
docs_dir = "docs"
tests_dir = "tests"

[sensor]
interfaces = "eth0,eth1"
promiscuous = true
snaplen = 65535
ring_size = 100000

[reassembler]
reassembly_timeout_ms = 30000
max_streams = 10000
reasm_buf_size = 65536

[analyzer]
protocols = "HTTP,DNS,TLS,SMB,FTP,SSH"
max_inspect_payload = 1048576

[rules]
max_rules = 100000
hot_reload = true
rules_file = "/etc/waf/rules.conf"

[detector]
port_scan_threshold = 100
port_scan_window_sec = 60
brute_force_threshold = 20
brute_force_window_sec = 300
exfil_threshold_bytes = 10485760
anomaly_score_threshold = 80

[alert]
max_alerts = 100000
alert_ttl_seconds = 604800
dedup_window_ms = 300000

[correlator]
window_ms = 300000
max_correlations = 50000
escalation_threshold = 70

[siem]
enabled = false
format = "CEF"
host = ""
port = 0
transport = "udp"

[stats]
sample_interval_sec = 60
max_samples = 10080
top_talkers_count = 25

[integration]
ids_integration = true
audit_integration = true
threat_intel_integration = true

[performance]
zero_copy = true
inspection_threads = 4
eval_cache_enabled = true
eval_cache_ttl_ms = 5000
