# zero_trust — Utkarsha OS Zero Trust Architecture Configuration
# Enterprise-grade configuration for premium skeleton

[module]
name = "zero_trust"
enabled = true
version = "1.0.0-enterprise-skeleton"
log_level = "info"

[security]
fail_closed = true
audit_enabled = true
constant_time = true
deny_by_default = true

[paths]
src_dir = "src"
include_dir = "include"
bin_dir = "bin"
build_dir = "build"
config_dir = "config"
docs_dir = "docs"
tests_dir = "tests"

[session]
# Default trust session TTL (30 seconds)
default_ttl_ns = 30000000000
max_sessions = 10000
# Re-authentication interval (60 seconds)
reauth_interval_ns = 60000000000
# Session bound to device posture
session_bound_to_device = true
# Session bound to source IP
session_bound_to_ip = true

[policy]
# Dynamic policy evaluation mode: static | dynamic
evaluation_mode = "dynamic"
# Hot-reload policies without restart
hot_reload = true
# Deny by default (Zero Trust principle)
deny_by_default = true
# Policy cache TTL (5 seconds)
policy_cache_ttl_ns = 5000000000
max_policies = 1000

[enforcement]
# Inline enforcement at micro-segment boundaries
inline_enforcement = true
# Enable micro-segmentation
micro_segmentation = true
# Boundary check for cross-segment traffic
boundary_check = true
max_segments = 1000
max_boundaries = 500

[continuous_auth]
# Continuous re-authentication enabled
enabled = true
# Require device posture check before session
posture_check_required = true
# Re-authenticate on context change (new IP, device, anomaly)
context_change_triggers_reauth = true
# Re-auth interval (60 seconds)
reauth_interval_ns = 60000000000

[posture]
# Measured boot verification required
measured_boot_required = true
# TPM attestation required
tpm_attestation_required = true
# OS patch level check
patch_level_check = true
# Authorized services check
services_check = false

[integration]
# Zero Trust sits on top of usrauth intersection model
usrauth_required = true
# IPS integration for session revocation
ips_integration = true
# IDS integration for anomaly-based re-auth
ids_integration = true
# malwarescan integration for compromise detection
malwarescan_integration = true
# audit logging via usrauth/audit
audit_integration = true

[performance]
# Evaluation cache enabled
eval_cache_enabled = true
# Evaluation cache TTL (5 seconds)
eval_cache_ttl_ns = 5000000000
# Max cached evaluations
max_cached_evals = 100000
